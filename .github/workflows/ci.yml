name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-schema-four-calibration-artifacts:
    name: regenerate schema 4 calibration artifacts
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'codex/immutable-calibration-trees'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Publish release and finalized staging builds
        shell: bash
        run: |
          set -euo pipefail
          for country in us uk be; do
            bun run publish:calibration-tree -- --country "$country" --backfill
          done
          for country in us uk; do
            bun run publish:calibration-tree -- --country "$country" --staging-finalized
          done

  hosted-python:
    name: hosted Python · dependencies · source APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The Modal runtime has its own hashed requirements. Do not sync the frozen
      # root evaluation lock into this environment.
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --require-hashes -r backend/requirements.lock
      - run: uv pip install "pytest>=8.3,<9" httpx==0.28.1 modal==1.5.5
      - run: uv pip check
      - run: uv run --no-sync python frontend/scripts/verify_hosted_runtime.py
      - run: uv run --no-sync python -m pytest frontend/tests -q

  frontend-tests:
    name: frontend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  frontend-build:
    name: frontend · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
