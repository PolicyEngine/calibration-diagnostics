name: Telemetry service

on:
  pull_request:
    paths:
      - telemetry-service/**
      - .github/workflows/telemetry-service.yml
  push:
    branches: [main]
    paths:
      - telemetry-service/**
      - .github/workflows/telemetry-service.yml
  workflow_dispatch:

concurrency:
  group: telemetry-service-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemetry_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemetry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telemetry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: telemetry-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - run: uv run pytest -q
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python -m telemetry_collector.migrate
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run alembic check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: docker build --tag microcosm-telemetry:validation .

  deploy-staging:
    name: Qualify image and migration in staging
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    env:
      DEPLOYMENT_ENVIRONMENT: staging
      PROJECT_ID: ${{ vars.TELEMETRY_GCP_PROJECT_ID }}
      REGION: ${{ vars.TELEMETRY_GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.TELEMETRY_ARTIFACT_REPOSITORY }}
      CLOUD_SQL_CONNECTION: ${{ vars.TELEMETRY_CLOUD_SQL_CONNECTION }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.TELEMETRY_RUNTIME_SERVICE_ACCOUNT }}
      MIGRATION_SERVICE_ACCOUNT: ${{ vars.TELEMETRY_MIGRATION_SERVICE_ACCOUNT }}
      SERVICE: ${{ vars.TELEMETRY_SERVICE }}
      MIGRATION_JOB: ${{ vars.TELEMETRY_MIGRATION_JOB }}
      IMAGE_NAME: ${{ vars.TELEMETRY_IMAGE_NAME }}
      DATABASE_SECRET_NAME: ${{ vars.TELEMETRY_DATABASE_SECRET_NAME }}
      MIGRATION_DATABASE_SECRET_NAME: ${{ vars.TELEMETRY_MIGRATION_DATABASE_SECRET_NAME }}
      JWT_SECRET_NAME: ${{ vars.TELEMETRY_JWT_SECRET_NAME }}
      READ_SECRET_NAME: ${{ vars.TELEMETRY_READ_SECRET_NAME }}
      PRODUCTION_CLOUD_SQL_CONNECTION: ${{ vars.TELEMETRY_PRODUCTION_CLOUD_SQL_CONNECTION }}
      PRODUCTION_SERVICE: ${{ vars.TELEMETRY_PRODUCTION_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment configuration
        run: telemetry-service/scripts/deploy.sh require-configuration

      - name: Require an isolated staging target
        run: telemetry-service/scripts/deploy.sh validate-environment-target

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TELEMETRY_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TELEMETRY_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        run: telemetry-service/scripts/deploy.sh build-and-push-image

      - name: Deploy an isolated maintenance revision
        run: telemetry-service/scripts/deploy.sh deploy-maintenance
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}

      - name: Resolve and verify the maintenance revision
        id: maintenance
        run: telemetry-service/scripts/deploy.sh resolve-and-verify-maintenance

      - name: Route traffic to maintenance mode
        run: telemetry-service/scripts/deploy.sh route-service-traffic
        env:
          REVISION: ${{ steps.maintenance.outputs.revision }}

      - name: Wait for old requests to finish
        run: telemetry-service/scripts/deploy.sh wait-for-cutover

      - name: Configure the database migration job
        run: telemetry-service/scripts/deploy.sh configure-migration-job
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}

      - name: Apply database migrations
        run: telemetry-service/scripts/deploy.sh apply-migrations

      - name: Deploy an isolated candidate revision
        run: telemetry-service/scripts/deploy.sh deploy-candidate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}

      - name: Resolve and verify the candidate revision
        id: candidate
        run: telemetry-service/scripts/deploy.sh resolve-and-verify-candidate

      - name: Exercise staging authentication, writes, and reads
        run: telemetry-service/scripts/qualify-staging.sh
        env:
          COLLECTOR_URL: ${{ steps.candidate.outputs.url }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STAGING_READ_TOKEN: ${{ secrets.MICROCOSM_TELEMETRY_COLLECTOR_READ_TOKEN }}

      - name: Promote the verified revision
        run: telemetry-service/scripts/deploy.sh route-service-traffic
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}

      - name: Verify the stable service address
        run: telemetry-service/scripts/deploy.sh verify-stable-service

  deploy-production:
    name: Deploy staging-qualified image to production
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ENVIRONMENT: production
      PROJECT_ID: ${{ vars.TELEMETRY_GCP_PROJECT_ID }}
      REGION: ${{ vars.TELEMETRY_GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.TELEMETRY_ARTIFACT_REPOSITORY }}
      CLOUD_SQL_CONNECTION: ${{ vars.TELEMETRY_CLOUD_SQL_CONNECTION }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.TELEMETRY_RUNTIME_SERVICE_ACCOUNT }}
      MIGRATION_SERVICE_ACCOUNT: ${{ vars.TELEMETRY_MIGRATION_SERVICE_ACCOUNT }}
      SERVICE: ${{ vars.TELEMETRY_SERVICE }}
      MIGRATION_JOB: ${{ vars.TELEMETRY_MIGRATION_JOB }}
      IMAGE_NAME: ${{ vars.TELEMETRY_IMAGE_NAME }}
      DATABASE_SECRET_NAME: ${{ vars.TELEMETRY_DATABASE_SECRET_NAME }}
      MIGRATION_DATABASE_SECRET_NAME: ${{ vars.TELEMETRY_MIGRATION_DATABASE_SECRET_NAME }}
      JWT_SECRET_NAME: ${{ vars.TELEMETRY_JWT_SECRET_NAME }}
      READ_SECRET_NAME: ${{ vars.TELEMETRY_READ_SECRET_NAME }}
      PRODUCTION_CLOUD_SQL_CONNECTION: ${{ vars.TELEMETRY_PRODUCTION_CLOUD_SQL_CONNECTION }}
      PRODUCTION_SERVICE: ${{ vars.TELEMETRY_PRODUCTION_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment configuration
        run: telemetry-service/scripts/deploy.sh require-configuration

      - name: Require the declared production target
        run: telemetry-service/scripts/deploy.sh validate-environment-target

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TELEMETRY_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TELEMETRY_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy an isolated maintenance revision
        run: telemetry-service/scripts/deploy.sh deploy-maintenance
        env:
          IMAGE_URI: ${{ needs.deploy-staging.outputs.image_uri }}

      - name: Resolve and verify the maintenance revision
        id: maintenance
        run: telemetry-service/scripts/deploy.sh resolve-and-verify-maintenance

      - name: Route traffic to maintenance mode
        run: telemetry-service/scripts/deploy.sh route-service-traffic
        env:
          REVISION: ${{ steps.maintenance.outputs.revision }}

      - name: Wait for old requests to finish
        run: telemetry-service/scripts/deploy.sh wait-for-cutover

      - name: Back up the production database
        run: telemetry-service/scripts/deploy.sh create-database-backup

      - name: Configure the database migration job
        run: telemetry-service/scripts/deploy.sh configure-migration-job
        env:
          IMAGE_URI: ${{ needs.deploy-staging.outputs.image_uri }}

      - name: Apply database migrations
        run: telemetry-service/scripts/deploy.sh apply-migrations

      - name: Deploy an isolated candidate revision
        run: telemetry-service/scripts/deploy.sh deploy-candidate
        env:
          IMAGE_URI: ${{ needs.deploy-staging.outputs.image_uri }}

      - name: Resolve and verify the candidate revision
        id: candidate
        run: telemetry-service/scripts/deploy.sh resolve-and-verify-candidate

      - name: Promote the verified revision
        run: telemetry-service/scripts/deploy.sh route-service-traffic
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}

      - name: Verify the stable service address
        run: telemetry-service/scripts/deploy.sh verify-stable-service
