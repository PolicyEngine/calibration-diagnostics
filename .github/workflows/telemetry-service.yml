name: Telemetry service

on:
  pull_request:
    paths:
      - telemetry-service/**
      - .github/workflows/telemetry-service.yml
  push:
    branches: [main]
    paths:
      - telemetry-service/**
      - .github/workflows/telemetry-service.yml
  workflow_dispatch:

concurrency:
  group: telemetry-service-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemetry_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telemetry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telemetry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: telemetry-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - run: uv run pytest -q
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python -m telemetry_collector.migrate
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run alembic check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: docker build --tag microcosm-telemetry:validation .

  deploy:
    name: Deploy verified image to Cloud Run
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.TELEMETRY_GCP_PROJECT_ID }}
      REGION: ${{ vars.TELEMETRY_GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.TELEMETRY_ARTIFACT_REPOSITORY }}
      CLOUD_SQL_CONNECTION: ${{ vars.TELEMETRY_CLOUD_SQL_CONNECTION }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.TELEMETRY_RUNTIME_SERVICE_ACCOUNT }}
      SERVICE: microcosm-telemetry
      MIGRATION_JOB: microcosm-telemetry-migrate
      IMAGE_NAME: collector
      DATABASE_SECRET: microcosm-telemetry-database-url
      JWT_SECRET: microcosm-telemetry-jwt-secret
      READ_SECRET: microcosm-telemetry-read-token
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment configuration
        run: telemetry-service/scripts/deploy.sh require-configuration

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TELEMETRY_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TELEMETRY_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        run: telemetry-service/scripts/deploy.sh build-and-push-image

      - name: Capture the current production revision
        id: previous
        run: telemetry-service/scripts/deploy.sh capture-production-revision

      - name: Configure the database migration job
        run: telemetry-service/scripts/deploy.sh configure-migration-job
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}

      - name: Apply database migrations
        run: telemetry-service/scripts/deploy.sh apply-migrations

      - name: Deploy an isolated candidate revision
        run: telemetry-service/scripts/deploy.sh deploy-candidate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}

      - name: Resolve and verify the candidate revision
        id: candidate
        run: telemetry-service/scripts/deploy.sh resolve-and-verify-candidate

      - name: Promote the verified revision
        id: promote
        run: telemetry-service/scripts/deploy.sh route-production-traffic
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}

      - name: Verify the stable service address
        run: telemetry-service/scripts/deploy.sh verify-stable-service

      - name: Restore the previous revision after failed stable verification
        if: failure() && steps.promote.outcome == 'success'
        run: telemetry-service/scripts/deploy.sh route-production-traffic
        env:
          REVISION: ${{ steps.previous.outputs.revision }}
