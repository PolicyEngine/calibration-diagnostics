name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: calibration-diagnostics-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODAL_ENVIRONMENT: main
  VERCEL_CLI_VERSION: 58.8.0
  VERCEL_ORG_ID: team_xsyTmFLMLGbHH7Qxu70R5G4r
  VERCEL_PROJECT_ID: prj_pL7dIJJ3M4hGcKr5pttWaOACVFtu

jobs:
  deploy:
    name: Modal backend, then Vercel frontend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require deployment credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MICROCOSM_MODAL_KEY: ${{ secrets.MICROCOSM_MODAL_KEY }}
          MICROCOSM_MODAL_SECRET: ${{ secrets.MICROCOSM_MODAL_SECRET }}
          MICROCOSM_TELEMETRY_COLLECTOR_URL: ${{ vars.MICROCOSM_TELEMETRY_COLLECTOR_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bash .github/scripts/deploy-dashboard.sh require-configuration

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TELEMETRY_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TELEMETRY_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check collector read secret exists
        run: bash telemetry-service/scripts/check-secrets-exist.sh "$READ_SECRET_NAME"
        env:
          PROJECT_ID: ${{ vars.TELEMETRY_GCP_PROJECT_ID }}
          READ_SECRET_NAME: ${{ vars.TELEMETRY_READ_SECRET_NAME }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2

      - name: Install deployment clients
        run: bash .github/scripts/deploy-dashboard.sh install-clients

      - name: Define commit-specific backend name
        id: identity
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/deploy-dashboard.sh define-backend

      - name: Deploy Modal backend
        env:
          CALIBRATION_MODAL_APP_NAME: ${{ steps.identity.outputs.modal_app }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: >-
          .deploy-venv/bin/modal deploy backend/modal_app.py
          --env "$MODAL_ENVIRONMENT"

      - name: Resolve Modal backend URL
        id: backend
        env:
          CALIBRATION_MODAL_APP_NAME: ${{ steps.identity.outputs.modal_app }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: bash .github/scripts/deploy-dashboard.sh resolve-backend

      - name: Verify Modal backend metadata
        env:
          MICROCOSM_MODAL_KEY: ${{ secrets.MICROCOSM_MODAL_KEY }}
          MICROCOSM_MODAL_SECRET: ${{ secrets.MICROCOSM_MODAL_SECRET }}
        run: >-
          .deploy-venv/bin/python frontend/scripts/deployment_smoke.py
          --url "${{ steps.backend.outputs.url }}/api/microcosm_variable"
          --source-commit "${{ steps.identity.outputs.source_commit }}"
          --check metadata
          --modal-key "$MICROCOSM_MODAL_KEY"
          --modal-secret "$MICROCOSM_MODAL_SECRET"

      - name: Build unaliased Vercel production candidate
        id: frontend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MICROCOSM_MODAL_KEY: ${{ secrets.MICROCOSM_MODAL_KEY }}
          MICROCOSM_MODAL_SECRET: ${{ secrets.MICROCOSM_MODAL_SECRET }}
          MICROCOSM_TELEMETRY_COLLECTOR_URL: ${{ vars.MICROCOSM_TELEMETRY_COLLECTOR_URL }}
          MICROCOSM_CALCULATION_URL: ${{ steps.backend.outputs.url }}
          MICROCOSM_BACKEND_SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash .github/scripts/deploy-dashboard.sh deploy-frontend

      - name: Verify staged frontend metadata
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          .deploy-venv/bin/python frontend/scripts/deployment_smoke.py
          --url "${{ steps.frontend.outputs.url }}/calibration/dashboard/api/microcosm_variable"
          --source-commit "${{ steps.identity.outputs.source_commit }}"
          --check metadata
          --vercel-bypass-secret "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Run staged national and state calculations
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          .deploy-venv/bin/python frontend/scripts/deployment_smoke.py
          --url "${{ steps.frontend.outputs.url }}/calibration/dashboard/api/microcosm_variable"
          --source-commit "${{ steps.identity.outputs.source_commit }}"
          --check full
          --vercel-bypass-secret "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Verify staged calibration releases and staging
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          bun run frontend/scripts/calibration-deployment-smoke.ts
          --url "${{ steps.frontend.outputs.url }}/calibration/dashboard"
          --vercel-bypass-secret "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Promote verified Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          bunx --bun "vercel@${VERCEL_CLI_VERSION}" promote
          "${{ steps.frontend.outputs.url }}"
          --yes
          --scope policy-engine
          --token "$VERCEL_TOKEN"

      - name: Verify promoted Vercel route
        run: >-
          .deploy-venv/bin/python frontend/scripts/deployment_smoke.py
          --url "https://calibration-diagnostics.vercel.app/calibration/dashboard/api/microcosm_variable"
          --source-commit "${{ steps.identity.outputs.source_commit }}"
          --check state

      - name: Verify promoted microcosm.institute route
        run: >-
          .deploy-venv/bin/python frontend/scripts/deployment_smoke.py
          --url "https://microcosm.institute/calibration/dashboard/api/microcosm_variable"
          --source-commit "${{ steps.identity.outputs.source_commit }}"
          --check state

      - name: Verify promoted calibration releases and staging
        run: >-
          bun run frontend/scripts/calibration-deployment-smoke.ts
          --url "https://calibration-diagnostics.vercel.app/calibration/dashboard"
