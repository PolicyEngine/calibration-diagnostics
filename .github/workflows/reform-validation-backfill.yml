name: Reform validation backfill

# Decoupled from the release build pipeline AND from the runner's hardware:
# the producer needs a full Microsimulation per batch plus the populace/torch
# import stack, which no longer fits GitHub's 7GB ubuntu-latest runner (every
# run since 2026-07-21 died to the OOM shutdown signal, including post-#107
# chunked runs). The simulation therefore runs on Modal
# (tools/reform_validation/modal_backfill_app.py, 64GB container); this
# workflow is only the trigger/commit layer and every tick finishes in
# seconds:
#
#   tick N:   release lacks an override and the Volume has no artifact ->
#             deploy + spawn the Modal run (fire-and-forget) and exit.
#   tick N+1: artifact is on the Volume -> download, commit the override,
#             open an auto-merging PR. (A `started` marker in the Modal
#             workdir prevents double-spawns while a run is in flight; the
#             Modal workdir checkpoints batch partials, so a re-spawn after
#             any failure resumes rather than restarts.)
#
# Requires repository secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET for the
# PolicyEngine Modal workspace.
#
# Run by hand for a specific release via the "Run workflow" button
# (release_id input), or leave it to the schedule.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id to backfill (blank = current latest)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reform-validation-backfill
  cancel-in-progress: false

env:
  HF_BASE: https://huggingface.co/datasets/policyengine/populace-us/resolve/main
  MODAL_VOLUME: cd-reform-validation

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.r.outputs.release_id }}
      should_run: ${{ steps.r.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          set -euo pipefail
          RID="${{ github.event.inputs.release_id }}"
          if [ -z "$RID" ]; then
            RID=$(curl -sL "$HF_BASE/latest.json" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['release_id'])")
          fi
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"
          if [ -f "frontend/lib/populace/reform-overrides/$RID.json" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$RID already backfilled — nothing to do."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$RID needs a reform-validation backfill."
          fi

  backfill:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RID: ${{ needs.resolve.outputs.release_id }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Modal client
        run: |
          set -euo pipefail
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET repository secrets are not set — the simulation runs on Modal and cannot proceed without them."
            exit 1
          fi
          python -m pip install --quiet modal

      - name: Harvest artifact or spawn Modal run
        id: harvest
        run: |
          set -euo pipefail
          if modal volume get "$MODAL_VOLUME" "reform_validation_$RID.json" /tmp/rv.json --force; then
            echo "::notice::Artifact found on the Volume — committing the override."
            echo "have_artifact=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "have_artifact=false" >> "$GITHUB_OUTPUT"
          SHA8=$(python3 -c "import hashlib;print(hashlib.sha256('$RID'.encode()).hexdigest()[:8])")
          if modal volume ls "$MODAL_VOLUME" "rv_$SHA8" 2>/dev/null | grep -q started; then
            echo "::notice::A Modal run for $RID is already in flight (rv_$SHA8/started) — will harvest on a later tick."
            exit 0
          fi
          PRODUCER_REF=$(curl -sL https://api.github.com/repos/PolicyEngine/populace/commits/main \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          modal deploy tools/reform_validation/modal_backfill_app.py
          python3 - "$RID" "$PRODUCER_REF" <<'EOF'
          import sys
          import modal

          release_id, producer_ref = sys.argv[1], sys.argv[2]
          fn = modal.Function.from_name("cd-reform-validation-backfill", "backfill")
          call = fn.spawn(release_id, producer_ref)
          print(f"::notice::Spawned Modal backfill {call.object_id} for {release_id} "
                f"at populace {producer_ref[:9]} — a later tick harvests the artifact.")
          EOF

      - uses: oven-sh/setup-bun@v2
        if: steps.harvest.outputs.have_artifact == 'true'

      - name: Commit override + typecheck
        if: steps.harvest.outputs.have_artifact == 'true'
        run: |
          set -euo pipefail
          cp /tmp/rv.json "frontend/lib/populace/reform-overrides/$RID.json"
          node scripts/gen-reform-overrides.mjs
          cd frontend && bun install --frozen-lockfile && bun run lint

      - name: Open auto-merge PR
        if: steps.harvest.outputs.have_artifact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="reform-validation/$RID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add frontend/lib/populace/reform-overrides/ frontend/lib/populace/reform-overrides.ts
          git commit -m "Backfill reform_validation.json for $RID"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "Backfill reform_validation.json for $RID" \
            --body "Automated backfill by \`.github/workflows/reform-validation-backfill.yml\`. The producer ran on Modal (\`tools/reform_validation/modal_backfill_app.py\`) against the released \`populace_us_2024.h5\` at the build's exact package versions; provenance is in the file's \`_backfill_note\`. The simulation is decoupled from both the build pipeline and the hosted runner, so it can neither block a release nor exhaust the runner."
          gh pr merge --squash --auto "$BR" || gh pr merge --squash "$BR"
