mapping_release: taxcalc-public-cps-chronicle-expansion-v3
mappings:
  - mapping_id: taxcalc-cps-returns-with-income-tax
    chronicle_selector:
      sources: [irs_soi]
      measures: [irs_soi.returns_with_income_tax_liability_after_credits]
      units: [count]
      entities: [tax_unit]
    execution: model
    source_expression: positive_iitax
    operation: weighted_count
    required_variables: [positive_iitax]
    mapping_quality: exact
    supported_dimensions: [filing_status, income_range]
    descriptive_dimensions: [income_range]
    supported_constraint_domains: [all_individual_income_tax_returns]
    supported_constraint_variables:
      - us:statutes/26/62#adjusted_gross_income
    calibration_exposure: external_validation

