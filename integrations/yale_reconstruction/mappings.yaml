mapping_release: yale-reconstruction-2024-overview-v1
mappings:
  - mapping_id: yale-eitc-return-count
    ledger_selector:
      sources: [irs_soi]
      measures: [irs_soi.returns_with_total_earned_income_credit]
      units: [count]
      entities: [tax_unit]
      fact_keys: [ledger.aggregate_fact.v2:659621627c8e3969cec14b37]
    execution: model
    source_expression: eitc
    operation: weighted_count
    required_variables: [eitc]
    mapping_quality: exact
    supported_dimensions: [income_range]
    descriptive_dimensions: [income_range]
    supported_constraint_domains: [all_individual_income_tax_returns]
    calibration_exposure: external_validation

