mapping_release: populace-policyengine-us-2024-overview-v1
mappings:
  - mapping_id: census-pep-resident-population-calibration-target
    ledger_selector:
      sources: [census_pep]
      measures: [census_pep.resident_population]
      units: [count]
      entities: [person]
      fact_keys: [ledger.aggregate_fact.v2:caae1a32d55fddfc7562d21d]
    execution: direct
    source_expression: __ones__
    operation: weighted_sum
    required_variables: [age]
    mapping_quality: exact
    supported_constraint_domains: [resident_population]
    supported_constraint_variables: [age]
    calibration_exposure: direct_calibration_target

