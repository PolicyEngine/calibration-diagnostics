[project]
name = "calibration-diagnostics-harness"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pyarrow>=18,<24", "pyyaml>=6,<7"]

[project.optional-dependencies]
microcosm = [
  "pandas>=2.2,<3",
  "policyengine-core==3.26.11",
  "policyengine-us==1.764.6",
  "tables>=3.10,<4",
]
taxcalc-cps = ["taxcalc==6.7.1"]
publish = ["huggingface-hub>=0.27,<2"]

[project.scripts]
evaluation-harness = "evaluation_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation_harness"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
