[project]
name = "release-history"
version = "0.1.0"
description = "Measure each published Microcosm release on a fixed reference model (calibration-diagnostics#224)."
requires-python = ">=3.13,<3.15"
# The shared producer pins no engine. Each country pins its own reference
# engine in countries/<code>/pyproject.toml, so one country's bump never moves
# another country's panel.
dependencies = [
  "huggingface-hub>=0.27,<2",
  # The release writer's own releases.json reader (PolicyEngine/microcosm-emitter).
  "microcosm-emitter-interface>=0.16,<1",
  "numpy>=1.26,<3",
  "packaging>=23",
  "pandas>=2,<4",
  "psutil>=5.9",
  "pyyaml>=6,<7",
]

[project.scripts]
release-history = "release_history.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.21,<5",
    "pandas-stubs>=3.1.0.261029",
    "pyright==1.1.414",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "types-psutil>=7.2.2.20261122",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP"]

[tool.pyright]
# Strict on the producer; the tests (fakes, monkeypatching) in the standard mode.
include = ["src", "tests"]
strict = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
