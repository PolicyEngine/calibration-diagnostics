[project]
name = "release-history"
version = "0.1.0"
description = "Measure each published Microcosm release on a fixed reference model (calibration-diagnostics#224)."
requires-python = ">=3.11,<3.15"
# The shared producer pins no engine. Each country pins its own reference
# engine in countries/<code>/pyproject.toml, so one country's bump never moves
# another country's panel.
dependencies = [
  "huggingface-hub>=0.27,<2",
  "numpy>=1.26,<3",
  "packaging>=23",
  "pandas>=2,<4",
  "psutil>=5.9",
  "pyyaml>=6,<7",
]

[project.scripts]
release-history = "release_history.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.21,<5",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
