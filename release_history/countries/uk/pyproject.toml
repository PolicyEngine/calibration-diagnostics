# The UK reference engine. Bumping policyengine here (then `uv lock`) gives the
# UK, and only the UK, a new panel; dispatch its backfill when ready.
[project]
name = "release-history-uk"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "policyengine[uk]==6.16.1",
  "release-history",
]

[tool.uv]
package = false

[tool.uv.sources]
release-history = { path = "../..", editable = true }
