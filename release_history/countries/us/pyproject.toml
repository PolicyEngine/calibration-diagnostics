# The US reference engine (trial). Bumping policyengine here (then `uv lock`)
# gives the US, and only the US, a new panel.
[project]
name = "release-history-us"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "policyengine[us]==6.16.1",
  "release-history",
]

[tool.uv]
package = false

[tool.uv.sources]
release-history = { path = "../..", editable = true }
